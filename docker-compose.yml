version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: quinch_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: quinch
      POSTGRES_USER: quinch_user
      POSTGRES_PASSWORD: Thiara3003.
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: "--auth-host=md5 --auth-local=md5"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quinch_user -d quinch"]
      interval: 10s
      timeout: 5s
      retries: 5
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: quinch_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@quinch.sn
      PGADMIN_DEFAULT_PASSWORD: quinch_secret
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data: