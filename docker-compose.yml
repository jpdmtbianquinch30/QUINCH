services:
  postgres:
    image: postgres:16-alpine
    container_name: quinch_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    # Le port DB n'est exposé que sur localhost : jamais accessible depuis
    # l'extérieur de la machine hôte, même si le firewall du serveur est mal
    # configuré. Pour s'y connecter depuis un outil externe (DBeaver, etc.),
    # utiliser un tunnel SSH vers le serveur.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quinch

  # Backend Laravel (PHP-FPM). Le code source est copié dans l'image au build
  # (pas de bind-mount du code en prod, pour un déploiement reproductible).
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: quinch_app
    restart: unless-stopped
    env_file:
      - backend/.env.docker
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - storage_data:/var/www/html/storage/app/public
    networks:
      - quinch

  # Même image que "app", mais lance le worker de queue au lieu de PHP-FPM
  # (traitement asynchrone : compression vidéo, notifications, etc.)
  queue:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: quinch_queue
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    env_file:
      - backend/.env.docker
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - storage_data:/var/www/html/storage/app/public
    networks:
      - quinch

  nginx:
    image: nginx:1.27-alpine
    container_name: quinch_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - storage_data:/var/www/html/storage/app/public:ro
    depends_on:
      - app
    networks:
      - quinch

  # pgAdmin : outil d'admin visuel pour Postgres, utile en dev/staging.
  # Optionnel — démarrer avec: docker compose --profile tools up
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: quinch_pgadmin
    restart: unless-stopped
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - quinch

networks:
  quinch:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
  storage_data:
