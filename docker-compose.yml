services:
  postgres:
    image: postgres:16-alpine
    container_name: quinch_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    # Port DB exposé uniquement sur localhost (tunnel SSH pour les outils externes).
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quinch

  # Redis : cache, files d'attente et compteurs du limiteur de débit.
  # volatile-lru : sous pression mémoire, seules les clés avec expiration
  # (cache) sont évincées, jamais les jobs de la file.
  redis:
    image: redis:7-alpine
    container_name: quinch_redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --maxmemory "${REDIS_MAXMEMORY:-512mb}" --maxmemory-policy volatile-lru --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quinch

  # Backend Laravel (PHP-FPM).
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: quinch_app
    restart: unless-stopped
    env_file:
      - backend/.env.docker
    environment:
      # Seul ce service applique les migrations au démarrage.
      RUN_MIGRATIONS: "true"
    # « Prêt » = preflight OK + migrations appliquées (marqueur écrit par l'entrypoint).
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/quinch-ready"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - storage_data:/var/www/html/storage/app/public
    networks:
      - quinch

  # Worker de la file "default" (notifications, etc.).
  queue:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    user: www-data
    stop_grace_period: 60s
    command: ["php", "artisan", "queue:work", "redis", "--queue=default", "--sleep=3", "--tries=3", "--max-time=3600", "--memory=256"]
    env_file:
      - backend/.env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    volumes:
      - storage_data:/var/www/html/storage/app/public
    networks:
      - quinch

  # Worker dédié au traitement vidéo (FFmpeg).
  # Plus de parallélisme : docker compose up -d --scale queue_videos=3
  queue_videos:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    user: www-data
    stop_grace_period: 120s
    command: ["php", "artisan", "queue:work", "redis", "--queue=videos", "--sleep=3", "--tries=3", "--timeout=600", "--max-time=3600", "--memory=512"]
    env_file:
      - backend/.env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    volumes:
      - storage_data:/var/www/html/storage/app/public
    networks:
      - quinch

  # Scheduler Laravel : sans lui, les jobs planifiés (libération du stock,
  # expiration Premium...) ne tournent jamais en production.
  scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: quinch_scheduler
    restart: unless-stopped
    user: www-data
    command: ["php", "artisan", "schedule:work"]
    env_file:
      - backend/.env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    volumes:
      - storage_data:/var/www/html/storage/app/public
    networks:
      - quinch

  nginx:
    image: nginx:1.27-alpine
    container_name: quinch_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./backend/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - storage_data:/var/www/html/storage/app/public:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - quinch

  # pgAdmin (optionnel) : docker compose --profile tools up
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: quinch_pgadmin
    restart: unless-stopped
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - quinch

networks:
  quinch:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
  storage_data: