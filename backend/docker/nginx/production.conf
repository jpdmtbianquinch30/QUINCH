# ─────────────────────────────────────────────────────────────────────────────
# Passerelle API de PRODUCTION (derrière Caddy, qui termine le TLS).
#
# Utilisée uniquement avec docker-compose.prod.yml : ce fichier REMPLACE
# default.conf. Le nginx n'est joignable que depuis le réseau Docker interne
# (aucun port publié) : le trafic public passe par Caddy (HTTPS, certificats
# Let's Encrypt automatiques).
#
# À adapter si le domaine change : les deux expressions « quinch\.sn » du
# bloc « map » ci-dessous (origines autorisées à lire les médias).
# ─────────────────────────────────────────────────────────────────────────────

# ── IP réelle du visiteur ────────────────────────────────────────────────────
# Caddy transmet l'IP du client dans X-Forwarded-For. On ne fait confiance à cet
# en-tête que s'il vient du réseau privé Docker : sans cela, le bannissement
# d'IP et les limiteurs de débit s'appliqueraient à l'IP de Caddy, donc à tout
# le monde à la fois.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Le TLS est terminé par Caddy : on le signale à PHP pour que Laravel génère
# des URL https:// (sinon : contenu mixte bloqué par les navigateurs).
map $http_x_forwarded_proto $quinch_https {
    default off;
    https   on;
}

# Origines autorisées à charger les médias (vidéos, images) depuis le navigateur.
# Remplace l'ancien « Access-Control-Allow-Origin: * ».
map $http_origin $quinch_cors_origin {
    default                              "";
    "~^https://(www\.)?quinch\.sn$"      $http_origin;
}

# ── Limitation de débit (en plus des limiteurs Laravel) ─────────────────────
# Réseaux mobiles : beaucoup d'abonnés partagent une même IP publique (CGNAT).
# Limites volontairement larges ; à ajuster après les tests de charge (phase 6).
limit_req_zone  $binary_remote_addr zone=quinch_auth:10m rate=30r/m;
limit_req_zone  $binary_remote_addr zone=quinch_api:20m  rate=50r/s;
limit_conn_zone $binary_remote_addr zone=quinch_conn:10m;
limit_req_status  429;
limit_conn_status 429;

server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;

    server_tokens off;

    # Corps de requête : 64 Mo suffisent pour 10 images de 5 Mo + audio.
    # Seul l'envoi de vidéo (location dédiée plus bas) accepte davantage.
    client_max_body_size 64m;
    client_header_timeout 15s;
    client_body_timeout 120s;
    keepalive_timeout 30s;
    send_timeout 60s;

    limit_conn quinch_conn 100;

    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;
    gzip_min_length 512;

    # Résolveur DNS interne de Docker : évite un 502 après recréation du conteneur « app »
    resolver 127.0.0.11 valid=10s;

    # Jamais de fichiers cachés (.env, .git...)
    location ~ /\. {
        deny all;
    }

    # Santé (healthcheck Docker), sans journal.
    location = /up {
        access_log off;
        set $upstream_app app:9000;
        include fastcgi_params;
        fastcgi_pass $upstream_app;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTPS $quinch_https;   # après « include » : sa valeur l'emporte
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
    }

    # Médias publics (images, vignettes, avatars) servis directement par nginx.
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin $quinch_cors_origin always;
        add_header Vary "Origin" always;
        autoindex off;
        location ~* \.(php|phtml|phar|html?|svg)$ { deny all; }
    }

    # Zone INTERNE utilisée par X-Accel-Redirect (VIDEO_ACCEL_REDIRECT=true)
    location /_protected_storage/ {
        internal;
        alias /var/www/html/storage/app/public/;
        sendfile on;
        tcp_nopush on;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin $quinch_cors_origin always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;
        add_header Vary "Origin" always;
    }

    # Connexion, inscription, codes : 30 requêtes/min/IP (rafale de 20 tolérée).
    # Les verrouillages fins (par compte) restent faits par Laravel.
    location ~ ^/api/v1/auth/(login|register|forgot-password|reset-password|google) {
        limit_req zone=quinch_auth burst=20 nodelay;
        try_files $uri /index.php?$query_string;
    }

    # Envoi de vidéo : seule route autorisée à dépasser 64 Mo.
    location ~ ^/api/v1/.*/upload-video$ {
        client_max_body_size 520m;
        limit_req zone=quinch_api burst=40 nodelay;
        try_files $uri /index.php?$query_string;
    }

    location / {
        limit_req zone=quinch_api burst=100 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Seul index.php est exécuté : tout autre .php renvoie 404.
    location = /index.php {
        set $upstream_app app:9000;
        fastcgi_pass $upstream_app;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $quinch_https;   # après « include » : sa valeur l'emporte
        # IP réelle (déjà corrigée par real_ip ci-dessus) : un X-Forwarded-For fourni
        # par le client est écrasé, il ne peut donc pas usurper une adresse IP.
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
        fastcgi_read_timeout 300;
    }
    location ~ \.php$ {
        return 404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
