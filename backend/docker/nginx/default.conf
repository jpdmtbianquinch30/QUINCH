server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    index index.php;

    client_max_body_size 520M;

    # Compression des réponses JSON de l'API
    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;
    gzip_min_length 512;

    # Résolveur DNS interne de Docker : évite un 502 après recréation du conteneur "app"
    resolver 127.0.0.11 valid=10s;

    # Sécurité : ne jamais servir les fichiers cachés (.env, .git, etc.)
    location ~ /\. {
        deny all;
    }

    # Images, posters, miniatures, avatars : servis directement par nginx
    # (avant : aucune règle -> 404 en Docker)
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Access-Control-Allow-Origin "*" always;
        autoindex off;
        location ~* \.(php|phtml|phar)$ { deny all; }
    }

    # Zone INTERNE utilisée par X-Accel-Redirect (VIDEO_ACCEL_REDIRECT=true)
    location /_protected_storage/ {
        internal;
        alias /var/www/html/storage/app/public/;
        sendfile on;
        tcp_nopush on;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        set $upstream_app app:9000;
        fastcgi_pass $upstream_app;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
