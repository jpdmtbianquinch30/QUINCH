# ─────────────────────────────────────────────────────────────────────────────
# Surcouche PRODUCTION : HTTPS automatique (Caddy) + frontend Angular servi avec
# une CSP stricte. À combiner avec docker-compose.yml :
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Nécessite Docker Compose >= 2.24.4 (étiquettes « !override » / « !reset »).
# Variables à définir dans le .env racine :
#   API_DOMAIN=api.quinch.sn   APP_DOMAIN=quinch.sn   ACME_EMAIL=vous@quinch.sn
# ─────────────────────────────────────────────────────────────────────────────
services:
  # Passerelle API : plus aucun port publié, seul Caddy y accède.
  nginx:
    ports: !reset []
    volumes: !override
      - ./backend/docker/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - storage_data:/var/www/html/storage/app/public:ro

  # Application Angular (fichiers statiques + en-têtes de sécurité / CSP).
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quinch_web
    restart: unless-stopped
    environment:
      # Origine de l'API autorisée dans la CSP (connect-src, img-src, media-src).
      API_ORIGIN: https://${API_DOMAIN:?définir API_DOMAIN dans .env}
      # Premier essai en préproduction : CSP_HEADER_NAME=Content-Security-Policy-Report-Only
      CSP_HEADER_NAME: ${CSP_HEADER_NAME:-Content-Security-Policy}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - quinch

  # Terminaison TLS : certificats Let's Encrypt automatiques (stockés dans caddy_data).
  caddy:
    image: caddy:2-alpine
    container_name: quinch_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:?définir API_DOMAIN dans .env}
      APP_DOMAIN: ${APP_DOMAIN:?définir APP_DOMAIN dans .env}
      ACME_EMAIL: ${ACME_EMAIL:?définir ACME_EMAIL dans .env}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      nginx:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - quinch

volumes:
  caddy_data:
  caddy_config:
