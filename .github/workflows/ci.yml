name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (PHPUnit + audit)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: quinch_testing
          POSTGRES_USER: quinch_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quinch_user -d quinch_testing"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: quinch_testing
      DB_USERNAME: quinch_user
      DB_PASSWORD: ci_password
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, gd, zip, intl, mbstring, bcmath
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Audit des dépendances PHP
        run: composer audit
      - name: Tests
        run: php artisan test

  frontend:
    name: Frontend (audit + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Audit des dépendances (production)
        run: npm audit --omit=dev --audit-level=high
      - name: Build de production
        run: npx ng build --configuration production

  docker:
    name: Docker (compose + build image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Valider docker-compose avec les fichiers d'exemple
        run: |
          cp .env.example .env
          cp backend/.env.docker.example backend/.env.docker
          docker compose config -q
      - name: Construire l'image backend
        run: docker build -f backend/Dockerfile -t quinch-backend:ci .
