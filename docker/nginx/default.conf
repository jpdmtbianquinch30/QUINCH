server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    index index.php;

    client_max_body_size 520M;

    # Résolveur DNS interne de Docker (127.0.0.11) : force Nginx à re-résoudre
    # le nom "app" à intervalle régulier plutôt qu'une seule fois au démarrage.
    # Sans ça, reconstruire/recréer le conteneur "app" (nouvelle IP interne)
    # laisse Nginx pointer sur l'ancienne IP -> 502 Bad Gateway jusqu'à un
    # redémarrage manuel de Nginx.
    resolver 127.0.0.11 valid=10s;

    # Sécurité : ne jamais servir les fichiers cachés (.env, .git, etc.)
    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        set $upstream_app app:9000;
        fastcgi_pass $upstream_app;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
