; Config PHP de production pour QUINCH.
; Objectif sécurité : ne jamais exposer d'informations internes au client.

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; Uploads (cohérent avec les limites vidéo/image définies côté Laravel)
upload_max_filesize = 520M
post_max_size = 520M
max_execution_time = 120
memory_limit = 512M

; Opcache — perf en production
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
